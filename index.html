<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="decisionstyle.css" />
  </head>
  <body>
    <h1 id="mainhead">Discussion Portal</h1>
    <div class="maindiv">
      <div id="leftdiv">
        <div id="updiv">
          <button id="newbtn">New Question form</button>
          <div id="searchContainer">
            <input type="text" placeholder="search questions" id="search" />
            <button id="addQuestionBtn"><i class="fas fa-plus"></i> Add Question</button>
          </div>
        </div>
        <div id="downdiv"></div>
      </div>
      <div id="rightdiv">
        <div id="main">
          <h1>Welcome to Decision Portal!</h1>
          <p>Enter a subject and question to get started</p>
          <input type="text" placeholder="Subject" id="subject" />
          <textarea name="text" id="question" placeholder="Question"></textarea>
          <button id="submitbtn">Submit</button>
        </div>
      </div>
    </div>

    <script src="./Script.js">
    </script>
  </body>
</html>
